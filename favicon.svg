  <circle cx="80" cy="80" r="27" fill="#1d2230"/>
  <g clip-path="url(#hole)">
    <rect x="58" y="58" width="44" height="44" fill="url(#deep)"/>
    <!-- Peldaños: cada uno más estrecho y más hondo -->
