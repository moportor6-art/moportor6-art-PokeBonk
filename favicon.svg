  <path d="M32 46a52 52 0 0 1 34-24" stroke="#ff9a9c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- La luz del fondo de la mazmorra sube y se derrama sobre la mitad blanca -->
