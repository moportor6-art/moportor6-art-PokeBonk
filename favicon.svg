<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 152 152">
  <defs>
    <radialGradient id="deep" cx="50%" cy="92%" r="80%"><stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#ffd54a"/><stop offset=".75" stop-color="#c46a10"/><stop offset="1" stop-color="#3a2a14"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd54a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#ff5a5f"/><stop offset=".6" stop-color="#e8343a"/><stop offset="1" stop-color="#b8242a"/></linearGradient>
    <linearGradient id="white" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef0f5"/><stop offset="1" stop-color="#cfd5e0"/></linearGradient>
    <linearGradient id="beam" y1="0" y2="1"><stop offset="0" stop-color="#ffe066" stop-opacity=".8"/><stop offset="1" stop-color="#ffe066" stop-opacity=".1"/></linearGradient>
    <clipPath id="bot"><path d="M12 80a68 68 0 0 0 136 0z"/></clipPath>
    <clipPath id="hole"><circle cx="80" cy="80" r="21"/></clipPath>
