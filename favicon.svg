    <path d="M63 74h34v4.5H63z" fill="#6e4618"/><path d="M63 72h34v2H63z" fill="#fff0bf"/>
    <path d="M67 81.5h26v4H67z" fill="#86561a"/><path d="M67 79.5h26v2H67z" fill="#fff6d6"/>
    <path d="M71 88.5h18v3.5H71z" fill="#a8701e" opacity=".85"/><path d="M71 86.5h18v2H71z" fill="#fffbe8"/>
    <!-- Paredes del pozo -->
    <path d="M58 58 71 94H58z" fill="#1d2230" opacity=".55"/><path d="M102 58 89 94h13z" fill="#1d2230" opacity=".55"/>
