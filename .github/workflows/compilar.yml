# Compila el APK (y la versión de Windows) y los publica como release cuando subes una etiqueta vN (v1, v2, v3...).
# El número de la etiqueta es el versionCode: la app avisa de la actualización
# si es mayor que el de la versión instalada.
name: Compilar y publicar APK

on:
  push:
    tags: ['v*', 'V*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # PokéSurvivor (juego de Godot en juegos/poke-survivor) exportado a web, y PokéIsaac al día, para meterlos en la app.
  survivor:
    runs-on: ubuntu-latest
    env:
      GODOT: 4.7.2-stable
    steps:
      # La release no cuenta como "la última" (para el actualizador de la app) hasta que su contenido está
      # publicado: mientras, se marca como prelanzamiento y el trabajo "contenido" la publica al final.
      - name: Release en preparación
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease || echo "la release aún no existe"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot y plantillas web (en caché)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT }}-web

      - name: Descargar Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          curl -sSL -o g.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v${GODOT}_linux.x86_64 godot
          curl -sSL -o t.tpz "https://github.com/godotengine/godot-builds/releases/download/$GODOT/Godot_v${GODOT}_export_templates.tpz"
          unzip -qj t.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' -d templates && rm t.tpz

      # Mismo PokéSurvivor = mismos bytes: la exportación de Godot cambia en cada compilación aunque el juego no
      # cambie, y el actualizador lo volvería a bajar entero. Se reusa mientras su código no cambie.
      - name: PokéSurvivor ya exportado (en caché)
        id: psexp
        uses: actions/cache@v4
        with:
          path: site/pokesurvivor
          key: pokesurvivor-web-${{ env.GODOT }}-${{ hashFiles('juegos/poke-survivor/**', 'site/pokeisaac/volver-pokebonk.js') }}

      - name: Exportar a web
        if: steps.psexp.outputs.cache-hit != 'true'
        run: |
          V=$(cat ~/godot/templates/version.txt)
          mkdir -p ~/.local/share/godot/export_templates/$V
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/$V/
          mkdir -p site/pokesurvivor
          cd juegos/poke-survivor
          ~/godot/godot --headless --import > ../../import.log 2>&1 || true
          ~/godot/godot --headless --export-release "Web" ../../site/pokesurvivor/index.html 2>&1 | tail -n 5
          cd ../..
          cp site/pokeisaac/volver-pokebonk.js site/pokesurvivor/
          ls -la site/pokesurvivor
          test -s site/pokesurvivor/index.pck

      - uses: actions/cache/save@v4
        with:
          path: site/pokesurvivor
          key: pokesurvivor-web-${{ github.run_id }}
          enableCrossOsArchive: true

      # PokéIsaac: se baja la versión más nueva de pokeisaac.com. Si falla, se usa la copia del repo.
      - name: PokéIsaac actualizado
        continue-on-error: true
        run: |
          cp -r site/pokeisaac /tmp/pokeisaac-repo
          python3 tools/actualizar_pokeisaac.py site/pokeisaac
          # PokéIsaac sin cuenta: si la versión nueva ya no admite el parche, se vuelve a la copia del repo.
          if ! python3 tools/parche_pokeisaac.py site/pokeisaac; then
            echo "::warning::PokéIsaac nuevo sin el modo sin cuenta: se usa la copia del repo"
            rm -rf site/pokeisaac && cp -r /tmp/pokeisaac-repo site/pokeisaac
          fi

      # Copia de respaldo de cada versión nueva de PokéIsaac en la rama respaldo-pokeisaac (por si la web desaparece).
      - name: Respaldo de PokéIsaac
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '\r\n' < site/pokeisaac/version.txt)
          URL="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code "$URL" "refs/tags/pokeisaac-$V" > /dev/null; then echo "Ya respaldada: $V"; exit 0; fi
          D=$(mktemp -d); cp -r site/pokeisaac/. "$D"/
          cd "$D"
          printf 'Respaldo de PokéIsaac %s (de @SrBatai, pokeisaac.com). Bajado al compilar PokeBonk.\n' "$V" > LEEME.txt
          git init -q -b respaldo-pokeisaac
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "PokéIsaac $V"
          git tag "pokeisaac-$V"
          git push -q -f "$URL" respaldo-pokeisaac "pokeisaac-$V"
          echo "Respaldada: $V"

      - uses: actions/cache/save@v4
        with:
          path: site/pokeisaac
          key: pokeisaac-web-${{ github.run_id }}
          enableCrossOsArchive: true

      # Pokelike 2.0 completo de pokelike.xyz (código, música e imágenes). Solo se vuelve a bajar cuando la web
      # cambia (se guarda en la caché de GitHub según el nombre de su código). Si falla, se usa la copia del repo (1.6).
      - name: Pokelike versión de la web
        id: plv
        continue-on-error: true
        run: echo "b=$(curl -fsSL -A "Mozilla/5.0 (Linux; Android 14) Chrome/130.0 Mobile" https://pokelike.xyz/ | grep -oE 'js/bundle[^\"]*\.js' | head -n1 | tr -c 'a-zA-Z0-9.' '_')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.plv.outputs.b != ''
        with:
          path: pokelike-web
          key: pokelike-v2-${{ steps.plv.outputs.b }}

      - name: Pokelike actualizado
        if: steps.plv.outputs.b != ''
        continue-on-error: true
        run: |
          if [ -f pokelike-web/index.html ]; then
            echo "Pokelike ya bajado antes (caché)"
          else
            python3 tools/actualizar_pokelike.py web pokelike-web
          fi
          test -f pokelike-web/index.html
          rm -rf site/pokelike
          cp -r pokelike-web site/pokelike
          echo "Pokelike en la app: $(cat site/pokelike/version.txt)"

      - name: Respaldo de Pokelike
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '\r\n' < site/pokelike/version.txt)
          H=$(cat site/pokelike/js/*.js site/pokelike/index.html | sha1sum | cut -c1-8)
          URL="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code "$URL" "refs/tags/pokelike-$V-$H" > /dev/null; then echo "Ya respaldada: $V-$H"; exit 0; fi
          D=$(mktemp -d); cp -r site/pokelike/. "$D"/
          cd "$D"
          printf 'Respaldo de Pokelike %s (pokelike.xyz). Bajado al compilar PokeBonk.\n' "$V-$H" > LEEME.txt
          git init -q -b respaldo-pokelike
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Pokelike $V-$H"
          git tag "pokelike-$V-$H"
          git push -q -f "$URL" respaldo-pokelike "pokelike-$V-$H"
          echo "Respaldada: $V-$H"

      - uses: actions/cache/save@v4
        with:
          path: site/pokelike
          key: pokelike-web-${{ github.run_id }}
          enableCrossOsArchive: true

      # PokéPath TD: copia del repo (su autor no publica el juego en abierto; para actualizar, se mete el
      # instalador nuevo con tools/preparar_pokepath.py).
      - uses: actions/cache/save@v4
        with:
          path: site/pokepath
          key: pokepath-web-${{ github.run_id }}
          enableCrossOsArchive: true

      # Pokémon Survivors (pedrobarretto/pokemon-survivors, código MIT): se compila su última versión con Node 24.
      # Solo cuando hay cambios en su repositorio (caché por commit). Cada versión se respalda en la rama
      # respaldo-pokemon-survivors. Si algo falla, se usa la copia del repo (site/pokemonsurvivors).
      - name: Pokémon Survivors versión
        id: psv
        continue-on-error: true
        run: echo "sha=$(git ls-remote https://github.com/pedrobarretto/pokemon-survivors HEAD | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pscache
        if: steps.psv.outputs.sha != ''
        with:
          path: pokemonsurvivors-web
          key: pokemonsurvivors-v3-${{ steps.psv.outputs.sha }}

      - uses: actions/setup-node@v4
        if: steps.psv.outputs.sha != '' && steps.pscache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Pokémon Survivors compilado
        if: steps.psv.outputs.sha != ''
        continue-on-error: true
        env:
          SHA: ${{ steps.psv.outputs.sha }}
        run: |
          if [ ! -f pokemonsurvivors-web/index.html ]; then
            set -e
            D=$(mktemp -d)
            git clone -q --depth 1 https://github.com/pedrobarretto/pokemon-survivors "$D/src"
            cd "$D/src"
            npm ci --no-audit --no-fund
            python3 "$GITHUB_WORKSPACE/tools/parche_pokemonsurvivors.py" .
            npx vite build --base /pokemonsurvivors/
            cd "$GITHUB_WORKSPACE"
            python3 tools/preparar_pokemonsurvivors.py "$D/src/dist" pokemonsurvivors-web "$SHA"
          fi
          test -f pokemonsurvivors-web/index.html
          rm -rf site/pokemonsurvivors
          cp -r pokemonsurvivors-web site/pokemonsurvivors
          # Sin las páginas de su web (también si la compilación viene de la caché, de antes de la 0.42).
          python3 tools/preparar_pokemonsurvivors.py --podar site/pokemonsurvivors
          echo "Pokémon Survivors en la app: $(cat site/pokemonsurvivors/version.txt)"

      - name: Respaldo de Pokémon Survivors
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          test -f site/pokemonsurvivors/version.txt
          V=$(tr -d '\r\n' < site/pokemonsurvivors/version.txt)
          URL="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code "$URL" "refs/tags/pokemonsurvivors-$V" > /dev/null; then echo "Ya respaldada: $V"; exit 0; fi
          D=$(mktemp -d); cp -r site/pokemonsurvivors/. "$D"/
          cd "$D"
          printf 'Respaldo de Pokémon Survivors (github.com/pedrobarretto/pokemon-survivors, commit %s), compilado para PokeBonk.\n' "$V" > LEEME.txt
          git init -q -b respaldo-pokemon-survivors
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Pokémon Survivors $V"
          git tag "pokemonsurvivors-$V"
          git push -q -f "$URL" respaldo-pokemon-survivors "pokemonsurvivors-$V"
          echo "Respaldada: $V"

      - continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/pokemonsurvivors
          key: pokemonsurvivors-web-${{ github.run_id }}
          enableCrossOsArchive: true

  apk:
    needs: survivor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache/restore@v4
        with:
          path: site/pokesurvivor
          key: pokesurvivor-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de PokéIsaac
        shell: bash
        run: rm -rf site/pokeisaac

      - uses: actions/cache/restore@v4
        with:
          path: site/pokeisaac
          key: pokeisaac-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de Pokelike
        shell: bash
        run: rm -rf site/pokelike

      - uses: actions/cache/restore@v4
        with:
          path: site/pokelike
          key: pokelike-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de PokéPath
        shell: bash
        run: rm -rf site/pokepath

      - uses: actions/cache/restore@v4
        with:
          path: site/pokepath
          key: pokepath-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: site/pokemonsurvivors
          key: pokemonsurvivors-web-${{ github.run_id }}
          enableCrossOsArchive: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de GitHub ya trae el SDK de Android; solo aseguramos las piezas que usa build.py
      - name: Instalar build-tools y plataforma Android 35
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;35.0.0" "platforms;android-35"
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: Número de versión
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NUM=$(echo "$TAG" | grep -oE '[0-9]+' | tail -n1)
          if [ -z "$NUM" ]; then NUM=$(jq .versionCode config.json); fi
          echo "code=$NUM" >> "$GITHUB_OUTPUT"

      - name: Clave de firma (secreto KEYSTORE_BASE64)
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clave.keystore"

      # Actualizador: lista de archivos (con SHA-256) de esta versión, dentro de la app.
      - name: Manifiesto del actualizador
        run: python3 tools/contenido.py base site --version ${{ steps.ver.outputs.code }}

      - name: Compilar
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clave.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! python3 build.py --version-code ${{ steps.ver.outputs.code }} 2>&1 | tee build.log; then
            tail -n 25 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PokeBonk.apk
          name: PokeBonk ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true

      # El juego tal cual va en el APK: lo publica el trabajo "contenido" para las actualizaciones por archivos.
      - name: Guardar el contenido para el actualizador
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: site
          key: sitio-final-${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Guardar el APK (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PokeBonk-apk
          path: dist/PokeBonk.apk

  # PokéBonk Lite: solo PokéBonk, sin los otros juegos (que siguen en el repositorio). Otro paquete (.lite), así se
  # puede tener instalada junto a la completa; edicion.js oculta la Sala de juegos y sus insignias.
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Quitar los otros juegos
        shell: bash
        run: |
          rm -rf site/pokeisaac site/pokelike site/pokepath site/pokemonsurvivors site/pokeplunder site/pokeoverlord site/pokesurvivor
          du -sh site

      - name: Paquete y nombre de la Lite
        run: |
          jq '.package += ".lite" | .appName = "PokéBonk Lite"' config.json > c.json && mv c.json config.json
          cat config.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar build-tools y plataforma Android 35
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;35.0.0" "platforms;android-35"

      - name: Número de versión
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NUM=$(echo "$TAG" | grep -oE '[0-9]+' | tail -n1)
          if [ -z "$NUM" ]; then NUM=$(jq .versionCode config.json); fi
          echo "code=$NUM" >> "$GITHUB_OUTPUT"

      - name: Clave de firma (secreto KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clave.keystore"

      - name: Manifiesto del actualizador
        run: python3 tools/contenido.py base site --version ${{ steps.ver.outputs.code }}

      - name: Compilar
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clave.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! python3 build.py --version-code ${{ steps.ver.outputs.code }} 2>&1 | tee build.log; then
            tail -n 25 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mv dist/PokeBonk.apk dist/PokeBonk-Lite.apk
          ls -la dist

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PokeBonk-Lite.apk
          name: PokeBonk ${{ github.ref_name }}
          prerelease: true

  # Versión de Windows: el mismo juego dentro de Electron. Solo al publicar una etiqueta o a mano.
  windows:
    needs: survivor
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    steps:
      # Los mismos bytes que en Linux (sin CRLF): el actualizador compara archivos por su SHA-256.
      - name: Sin conversión de saltos de línea
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache/restore@v4
        with:
          path: site/pokesurvivor
          key: pokesurvivor-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de PokéIsaac
        shell: bash
        run: rm -rf site/pokeisaac

      - uses: actions/cache/restore@v4
        with:
          path: site/pokeisaac
          key: pokeisaac-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de Pokelike
        shell: bash
        run: rm -rf site/pokelike

      - uses: actions/cache/restore@v4
        with:
          path: site/pokelike
          key: pokelike-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Quitar la copia vieja de PokéPath
        shell: bash
        run: rm -rf site/pokepath

      - uses: actions/cache/restore@v4
        with:
          path: site/pokepath
          key: pokepath-web-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: site/pokemonsurvivors
          key: pokemonsurvivors-web-${{ github.run_id }}
          enableCrossOsArchive: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Número de versión
        id: ver
        shell: bash
        run: |
          NUM=$(echo "${GITHUB_REF_NAME}" | grep -oE '[0-9]+' | tail -n1 || true)
          if [ -z "$NUM" ]; then NUM=0; fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      # Caché de Electron: si su servidor de descargas falla (error 504), se usa la copia guardada.
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ hashFiles('desktop/package.json') }}

      - name: Manifiesto del actualizador y certificado de la firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python tools/contenido.py base site --version ${{ steps.ver.outputs.num }}
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clave.keystore"
            KT=$(command -v keytool || echo "$JAVA_HOME/bin/keytool")
            "$KT" -exportcert -rfc -alias pokebonk -keystore "$RUNNER_TEMP/clave.keystore" -storepass "$KEYSTORE_PASSWORD" > desktop/clave.pem
            rm -f "$RUNNER_TEMP/clave.keystore"
            head -1 desktop/clave.pem
          else
            echo "sin clave: el actualizador de Windows no podrá comprobar firmas"; : > desktop/clave.pem
          fi

      - name: Preparar y compilar
        shell: bash
        working-directory: desktop
        run: |
          rm -rf site && cp -r ../site site
          for i in 1 2 3 4; do
            npm install --no-audit --no-fund && break
            echo "npm install falló (intento $i); reintento en 30 s"; sleep 30
            [ "$i" = 4 ] && exit 1
          done
          npx electron-builder --win --publish never -c.extraMetadata.version=0.9.${{ steps.ver.outputs.num }}
          ls dist

      # Prueba: abre la app 45 s y deja en el registro de la compilación los errores y una captura (base64).
      - name: Probar la app de Windows
        shell: bash
        working-directory: desktop
        continue-on-error: true
        run: |
          mkdir -p diag
          export PB_DIAG_DIR="$(cygpath -w "$PWD/diag")"
          timeout 150 ./dist/win-unpacked/PokeBonk.exe || echo "salida: $?"
          echo "===== REGISTRO ====="
          cat diag/registro.txt || echo "sin registro"
          echo "===== CAPTURA ====="
          base64 -w0 diag/captura.jpg 2>/dev/null || echo "sin captura"
          echo
          echo "===== FIN ====="

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/PokeBonk-Windows-Instalador.exe
            desktop/dist/PokeBonk-Windows-*.zip
          prerelease: true

      - name: Guardar (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PokeBonk-Windows
          path: |
            desktop/dist/PokeBonk-Windows-Instalador.exe
            desktop/dist/PokeBonk-Windows-*.zip

  # PokéBonk Lite para Windows: el mismo programa con otro nombre (instalación y partidas aparte) y sin los otros juegos.
  windows-lite:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    steps:
      # Los mismos bytes que en Linux (sin CRLF): el actualizador compara archivos por su SHA-256.
      - name: Sin conversión de saltos de línea
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Quitar los otros juegos
        shell: bash
        run: rm -rf site/pokeisaac site/pokelike site/pokepath site/pokemonsurvivors site/pokeplunder site/pokeoverlord site/pokesurvivor

      - name: Nombre de la Lite (otro programa, con sus propias partidas)
        shell: bash
        working-directory: desktop
        run: |
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.name='pokebonk-lite';p.productName='PokeBonk Lite';Object.assign(p.build,{appId:'com.moportor6.pokebonk.lite',productName:'PokeBonk Lite'});p.build.win.artifactName='PokeBonk-Lite-Windows-\${version}.\${ext}';Object.assign(p.build.nsis,{shortcutName:'PokeBonk Lite',artifactName:'PokeBonk-Lite-Windows-Instalador.\${ext}'});require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          cat package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Número de versión
        id: ver
        shell: bash
        run: |
          NUM=$(echo "${GITHUB_REF_NAME}" | grep -oE '[0-9]+' | tail -n1 || true)
          if [ -z "$NUM" ]; then NUM=0; fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      # Caché de Electron: si su servidor de descargas falla (error 504), se usa la copia guardada.
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ hashFiles('desktop/package.json') }}

      - name: Manifiesto del actualizador y certificado de la firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python tools/contenido.py base site --version ${{ steps.ver.outputs.num }}
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clave.keystore"
            KT=$(command -v keytool || echo "$JAVA_HOME/bin/keytool")
            "$KT" -exportcert -rfc -alias pokebonk -keystore "$RUNNER_TEMP/clave.keystore" -storepass "$KEYSTORE_PASSWORD" > desktop/clave.pem
            rm -f "$RUNNER_TEMP/clave.keystore"
            head -1 desktop/clave.pem
          else
            echo "sin clave: el actualizador de Windows no podrá comprobar firmas"; : > desktop/clave.pem
          fi

      - name: Preparar y compilar
        shell: bash
        working-directory: desktop
        run: |
          rm -rf site && cp -r ../site site
          for i in 1 2 3 4; do
            npm install --no-audit --no-fund && break
            echo "npm install falló (intento $i); reintento en 30 s"; sleep 30
            [ "$i" = 4 ] && exit 1
          done
          npx electron-builder --win --publish never -c.extraMetadata.version=0.9.${{ steps.ver.outputs.num }}
          ls dist

      # Prueba: abre la app 45 s y deja en el registro de la compilación los errores y una captura (base64).
      - name: Probar la app de Windows
        shell: bash
        working-directory: desktop
        continue-on-error: true
        run: |
          mkdir -p diag
          export PB_DIAG_DIR="$(cygpath -w "$PWD/diag")"
          timeout 150 "./dist/win-unpacked/PokeBonk Lite.exe" || echo "salida: $?"
          echo "===== REGISTRO ====="
          cat diag/registro.txt || echo "sin registro"
          echo "===== CAPTURA ====="
          base64 -w0 diag/captura.jpg 2>/dev/null || echo "sin captura"
          echo
          echo "===== FIN ====="

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/PokeBonk-Lite-Windows-Instalador.exe
            desktop/dist/PokeBonk-Lite-Windows-*.zip
          prerelease: true

      - name: Guardar (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PokeBonk-Lite-Windows
          path: |
            desktop/dist/PokeBonk-Lite-Windows-Instalador.exe
            desktop/dist/PokeBonk-Lite-Windows-*.zip

  # Actualizador: publica el contenido de esta versión archivo por archivo (rama y etiqueta contenido-vN) y su
  # manifiesto firmado con la clave del APK, con el APK y el instalador completos para cuando cambie la app.
  contenido:
    needs: [apk, windows, lite, windows-lite]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La caché se extrae sobre la ruta original (site): primero se quita la del checkout.
      - name: Quitar el site del checkout
        shell: bash
        run: rm -rf site

      - uses: actions/cache/restore@v4
        with:
          path: site
          key: sitio-final-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Pasarlo a sitio
        shell: bash
        run: mv site sitio

      - name: APK e instalador de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p completos
          for i in 1 2 3; do gh release download "$GITHUB_REF_NAME" -D completos -p PokeBonk.apk -p PokeBonk-Windows-Instalador.exe -p PokeBonk-Lite.apk -p PokeBonk-Lite-Windows-Instalador.exe --clobber && break; sleep 20; done
          ls -la completos

      - name: Publicar (manifiesto firmado, rama contenido y etiqueta contenido-vN)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publicar_contenido.sh "$GITHUB_REF_NAME" sitio completos
