# Copia tal cual de un juego web (para revisarlo y como respaldo). Se lanza a mano, o al cambiar este archivo.
name: Copia de un juego web

on:
  workflow_dispatch:
    inputs:
      url:
        description: Dirección del juego
        default: https://khydra98.itch.io/pokeplunder
      rama:
        description: Rama donde se guarda
        default: respaldo-pokeplunder-web
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-juego.yml', 'tools/actualizar_pokelike.py']

permissions:
  contents: write

jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.event.inputs.url || 'https://khydra98.itch.io/pokeplunder' }}
      RAMA: ${{ github.event.inputs.rama || 'respaldo-pokeplunder-web' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bajar el juego
        run: |
          D=$(mktemp -d)
          echo "D=$D" >> "$GITHUB_ENV"
          # Juegos de itch.io que se juegan en el navegador: la página del juego de verdad está en html-classic.itch.zone.
          if echo "$URL" | grep -q 'itch.io'; then
            P=$(curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0" "$URL" | sed 's/&quot;/"/g; s#\\/#/#g')
            J=$(echo "$P" | grep -oE 'https://html-classic\.itch\.zone/html/[0-9]+/[^"<> ]*' | head -n1)
            echo "Juego en itch.io: $J"
            if [ -z "$J" ]; then
              echo "No se encontró el juego web en esa página de itch.io. Juegos enlazados en ella:"
              echo "$P" | grep -oE 'https://[a-z0-9-]+\.itch\.io/[a-z0-9-]+' | sort -u | head -n 40
              echo "Pistas del juego en la página:"
              echo "$P" | grep -oE '.{0,120}(itch\.zone|embed-upload|iframe|game_frame|load_game|html5).{0,160}' | head -n 12
              exit 1
            fi
            echo "$J" > "$D/_origen.txt"
            URL="${J%index.html}"
            case "$URL" in */) ;; *) URL="${URL%/*}/";; esac
          fi
          PL_REFERER="https://itch.io/" PL_ORIGIN="$URL" python3 tools/actualizar_pokelike.py crudo "$D"
          curl -fsSL -A "Mozilla/5.0 (Linux; Android 14) Chrome/130.0 Mobile" -D "$D/_cabeceras.txt" -o /dev/null "$URL" || true
          find "$D" -type f | sed "s|$D/||" | sort > "$D/_archivos.txt"
          wc -l "$D/_archivos.txt"; du -sh "$D"
      - name: Guardar en la rama
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$D"
          git init -q -b "$RAMA"
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Copia tal cual de $URL"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" "$RAMA"
