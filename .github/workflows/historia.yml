# Subversión propia: baja de Pokémon Showdown los retratos del modo historia (PokéBonk Lite) que no trae Pokémon Reloaded
# (tools/historia_showdown.txt) y los sube a main. Se lanza sola al cambiar la lista, o a mano.
name: Historia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/historia_showdown.txt
      - .github/workflows/historia.yml
permissions:
  contents: write
jobs:
  historia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar retratos
        run: |
          mkdir -p site/assets/historia
          grep -vE '^\s*(#|$)' tools/historia_showdown.txt | while read dest nombre; do
            curl -fsSL --retry 3 "https://play.pokemonshowdown.com/sprites/trainers/$nombre.png" -o "site/assets/historia/$dest.png" || echo "::warning::falta $nombre"
          done
          ls site/assets/historia | wc -l
      - name: Subir a main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/assets/historia
          git commit -m "Retratos del modo historia (Pokémon Showdown)" || { echo "nada nuevo"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
