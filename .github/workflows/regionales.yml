# Subversión propia: monta los sprites de las formas regionales (tools/regionales.py) desde el
# PMD Sprite Repository y los sube a main. Se lanza solo al cambiar el script, o a mano.
name: Regionales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/regionales.py
      - site/regionales.js
      - .github/workflows/regionales.yml
permissions:
  contents: write
jobs:
  regionales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar
        run: |
          pip install pillow
          python3 tools/regionales.py site
      - name: Subir a main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/assets/pmd site/assets/pmd-shiny site/assets/portraits site/assets/portraits-shiny site/data/sprites.json site/regionales-hechas.js site/assets/defineProperty-*.js
          git commit -m "Formas regionales (PMD Sprite Repository)" || { echo "nada nuevo"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
